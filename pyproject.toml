[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mace-ictc-hp"
version = "0.2.12"
description = "MACE-ICTC high-performance Cartesian operators and whole-network runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm-Noncommercial-1.0.0 AND MIT" }
dependencies = ["torch>=2.7", "numpy>=1.20", "e3nn>=0.4.4,<0.6", "ase>=3.22", "opt-einsum-fx>=0.1.4"]

[project.optional-dependencies]
hp = ["triton>=3.3; platform_system=='Linux'", "ninja"]
train = ["h5py", "pandas", "scipy"]
conversion = ["mace-torch>=0.3.16"]

[project.scripts]
mff-train = "mace_ictc.cli.train:main"
mff-export-aoti = "mace_ictc.cli.export_aoti_core:main"
mff-export-core = "mace_ictc.cli.export_libtorch_core:main"
mff-convert-mace = "mace_ictc.cli.convert_mace:main"
mff-preprocess = "mace_ictc.cli.preprocess:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICE", "LICENSE_SCOPE.md", "COMMERCIAL_LICENSE.md"]

[tool.setuptools.packages.find]
include = ["mace_ictc", "mace_ictc.*"]
exclude = ["mace_ictc.bench", "mace_ictc.bench.*", "mace_ictc.test", "mace_ictc.test.*"]

[tool.setuptools.package-data]
mace_ictc = ["models/_ictd_basis/v1/*.pt", "csrc/*.cpp", "csrc/*.cu"]
